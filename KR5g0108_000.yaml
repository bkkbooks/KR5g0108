front:
  text: 玄真靈應寶籤序始吾廟食劒嶺所降清河內傳落筆雙松凡所禱者竟以夢應然未嘗以籤行於世今正殿及家慶樓廟吏率借他籤為苟且計如十二真君籤即青城丈人觀籤如易卦在家慶尤無所證況夫川蜀行祠祇作朱真人內外籤耳今吾親考較妙用上自天文下至地理與夫運數之向背物情之離合者委嗣子等七人巧譬善諭以上中下各作成一百二十籤以十二時每時各三十籤又以五行金木水火土輳成三百六十五籤以按周天三百六十五度之數庶幾士之向信者隨其願力而各有所得焉九天開化主宰靈應帝君序
  hash: sha256:42defd69e426b8eef9fdf22e9b1f24b537f3c4165379110c9d152a1643fae699
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0108_HFL_000-001a, image: hfl/1010/1010-102.png}
body:
  text: 九天開化主宰文昌帝君寶誥至心皈命禮不驕帝境玉真慶宫現九十八化之行藏顯億千萬種之神異飛鸞開化於在在如意救劫以生生至孝至仁功存者道儒釋教不驕不樂職盡乎天地水官功德難量威靈莫測大悲大願大聖大慈九天輔元開化主宰司祿職貢舉真君七曲靈應保德宏仁大帝談經演教消劫行化更生永命天尊
  hash: sha256:88ed1946d4fb75ebe7a30b7855ee2a5ef51df4368df749c5f6d5218456007583
