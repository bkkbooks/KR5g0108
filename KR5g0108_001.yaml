front:
  text: 玄真靈應寳籤卷上
  hash: sha256:e5c493af528e1868640e4e93e29b4d3c42da290a2418d19985c5e68ca23d45c3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0108_HFL_001-001a, image: hfl/1010/1010-106.png}
body:
  text: 子時第一風雲慶會上上喜遇昇平日加官誥命封前程無限好仙女跨飛龍築黄金之臺座納士招賢拜丹詔之勳封酬功受爵攀龍附鳳穩昇碧漢之中雲集風生慶會紫霄之上子時第二騰達有望上上青年人物好智識勝蕭何謀事深如意眉濡喜色多車書混一文章禮樂俱興道德無彊仁義忠信悉備去天尺五拜丹韶於金階不次之除受皇恩於玉陛子時第三謹守勿失中平任使鷹鸇逐防他虎豹威簡居君子道何處覔閑非鷹鸇之逐狡兔伏於山林虎豹之威行客防於道路君子静於守道萬禍不侵小人冗亂私心一謀不遂子時第四待時必捷中平千里一將軍奇謀藏未伸浪高雲捲處血染戰袍新英略之將得其謀則攻必勝戰必克才志之人遇其時則道必亨名必遂將有謀而功捷不難人得時而名超甚易子時第五望事難成下下有口笑葫蘆求名費遠圖水萍空浪泛何日達天衢將無作有孜孜空費於精神指實爲虚念念謾勞於夢想求一事若浮雲中呼鴈望一事如急浪裏飄萍子時第六親好兩同上上風流王謝家秦晋各争誇自是吹簫客好簪鳴鳳花風流王謝堂前紫燕争飛秦晋交歡池内綵鴛對偶乘鸞鳳吹簫泛月天上遨遊講親好鼓瑟簪花人間歡樂子時第七重疊有喜上上蓮幕既初開重登錦上臺慶他龍虎會傑出間生才稱心之美如開碧沼之蓮樂意之歡若玩錦堂之景龍虎會登仙之質璞藥就丹成賢傑生濟世之奇才安民輔國子時第八更改則吉中平局促更何爲和融喜入時任機隨處好高下穩行之局促之心情不舒而意不暢和融之景改則吉而動則安蓋機縁之有分進達謀通凡舉用而無疑上和下順子時第九事多奸宄下下一女既相逢那堪二女通秪因隨處礙應使浪生風事多滯礙皆因三女相逢處用差池蓋謂衆情不順平水因風而起浪静中不寧安居因動以生迍暗中詭詐子時第十内外和同上上姻婭既相通朋簪臭味同魚書傳尺素留得幾家風諧合姻㜕之好意合情通和同馨味之歡謀宜事遂魚鴈得佳音而有喜内悅外和家庭保福禄之榮昌上從下順子時第十一守否方泰中平剥盡復方生時通路有亨謹身應不失狂妄莫重行六陰至極陰極陽氣始生吾道至窮道窮變否爲泰否與泰循環之理有盛有衰陰與陽生殺之端有榮有謝子時第十二所求阻隔下下久客無歸路津梁又失時望郷臺上立何見免嶇崎羈旅之情遠在天涯海角求謀之意近逢水遠山遥登嶇崎絶有艱辛路危道險望音信殊無通報鴈杳魚沉子時第十三前程大吉上上雲散月重明風恬浪不生岸高船自濟撫掌一家榮陰雲忽散一輪明月現光輝災蹇頓消萬里前程平坦率進一事進無礙滯風浪恬然謀一事謀有亨通歡歌撫掌子時第十四占信有望上上燈結數層花池蓮發異葩秪因和氣溢佳信落天涯燈結花報天涯之喜信池發蓮稱人事之歡心氤氲和氣仰感萬物之豐登瑞靄祥雲覆護一門之康泰子時十五望外小喜上上幸結殘花實喜生枯樹枝偶然春意在雙喜笑來遲庭前枯木忽生榮茂之柯園内殘花喜結桃梅之實望中事不期而就就則有成心下慮偶爾而消消則無害子時第十六大宜進望上上桂子十分香瓊瑶映碧堂更加風力便攀附看翺翔瓊瑶映玉乾坤發瑩浄之光巖桂開金宇宙噴馨香之氣風力便直衝霄漢萬里翶翔神物助俓達亨衢一身康泰子時第十七圖名遂意上上風激上青霄鵬搏六翮秋尺書雲外至一舉占鼇頭圖名通達如鵰鶚飛奮於秋天謀利亨嘉若鶯燕嬌吟於春圃風一激雲開萬里穩穩逍遥舉一事神助百祥平平遂意子時第十八先滯後成中平後笑必先咷寧無損一毫度舟應有濟江穩絶風濤先號咷而後笑悲極生歡始蹇塞而終通損中有益江穩者波平風静事泰心安有濟者時至運臨脱災出滯子時第十九占福有餘上上利劒若吹毛雲高山亦高此身無障礙食息豈辭勞道彌德廣高如齊嶽之山事快情通利若吹毛之劒有福力有謀必遂勿怠勤勞無障礙無所不通自然允濟子時第二十危迫無成下下牛後尾分岐那堪鷄口悲望人人不見回首事應遲牛乃力耕之物牛尾分則事失田荒鷄爲警旦之禽口生悲則門災户擾所望者稽遲有滯所用者迫逼不成子時二十一望信兩失下下無情恨食言風險又無船日暗應迷路煙雲遮碧天對暮春無情有恨花落水流望長江有浪無船魂消魄散紅日晩向迷歸路戚戚憂心碧雲障猶隔天涯沉沉别意子時二十二向進通達上上秋月十分圓雲開光滿川家家渾不礙江映一青天雲開天浄月華現玉鑑之無塵災退福生家門集金真之垂祐進向則有圓無缺光滿十分求利則無礙有成歡生一慶子時二十三勞心事成中平鑛盡見真金苗長識土深青雲終有路休恩苦勞心黄金出於鑛石非烹煉不能成其寳真仙生於凡胎非功行不能成其道耕耘得時稼穡登勤勞勿憚謀用遂子時二十四無欺有望中平月被浮雲暗鑑猶塵土侵若交無障礙清却一丹心雲藏月暗風吹雲散月明塵掩鑑昏人拂塵消鑑瑩雖有侵欺之惱易釋易除更無唇吻之非保安保吉子時二十五謀財有成上上珠玉冨囊中財粮亦自通不資人力助其德日無窮粮食豐足六天之内一天金玉盈箱五福之中一福食與財豐盈雙美日益無窮福與禄興盛俱臨時增有濟子時二十六用事有成上上培壅積年功風雲要發蹤共開龍虎道何日不侯封合抱之木㙲培非一日之功侯爵之封陞擢乃功勳之賞虎嘯則風生滿谷威大神全龍吟則雲布彌天轟雷致雨子時二十七官事而解中平官事恐悠悠淹留幾月休但存公直理方得免憂囚訟終凶而返吉勿恃勿欺事先亂而後寧且謹且守理雖存於公道脱免爲先身當離於淹留免凶爲上子時二十八自執不通下下强弱謾紛紛崎嶇獨掩門幽閑無活路飢餓任黄昏不義不仁何異以强凌弱多貪多欲有如倚冨吞貧上下傷於和氣獨處幽閑内外生於怨心兀居寒餓子時二十九百事未遂下下船礙石中波徒行驚渡河雲高山亦險愁寂奈情何謀心恐恐水中石礙行船用意惶惶山下虎攔過客險阻者不能進步無力躋攀困厄者惟起愁情何時通遂子時三十祈福免災中平自有菩提路家家香火縁欲逃羅網厄踈朗一青天上善之人俓達菩提之路修真之士超登快樂之門心無綰亂一身自脱網羅意若謹持百事豈能拘礙丑時第一求之必得中平得失自茫茫閑愁慮更長莫辭勤着意金玉再盈箱得失乃乘除之法不用關心興衰乃代謝之宜何勞着念事稱遂未有不求而自至稻豐熟豈有不種而自生丑時第二事與心契中平紅緑爲留春佳人情更親按頭香未斷歌笑草中茵契緣相合所事無不歡諧識見和同所用自然親好香未斷再添新篆氣象氤氲酒未乾又續新杯人情悦懌丑時第三名職改遷上上閬苑一時春庭前花柳新市城皆好語草本亦欣欣春雷微震藏者動而蟄者興陽氣方生柳吐芽而花破萼好語者傳佳音滿國欣顔者布歡信盈門丑時第四財帛見喜上上憶昔傷時態今朝花草春稻粮隨處足瓜李一時新時通運泰今者是而往者非臈盡春回草自萌而花自發瓜李熟秀而得實共慶時新稻粮足而家給歲豐普沾福慶丑時第五病患臨身下下天災未可祈力困豈能支三蟲昂首立非血不成悲重病未能痊瘥實乃天災沉痾尚自淹延豈非今遣况三蟲而食血慮防蟲毒之危恐二口而衝心必致患危之厄丑時第六小小見喜中平踈散任情真花間謾染身笑吟燈燭夜樽爼客相親身踈散心除罣礙逸樂天真道蹤横意趣玄微逍遥人世狂花野草更無一㸃塵縈列燭開筵自有百端親好丑時第七謹事小成上上莫愁空浪心去去不消沉幸自逢時變珍良喜獲金駕商舟而圖名利必不空回憑貨物以求資財必無消折待變者時昌歲泰無所不通獲金者利厚財豐無所不濟丑時第八藥石無効下下深病入膏肓難施扁鵲方藥石非苦口千里一難當病入膏肓已有倒懸之危急藥修良劑更無神効之奇功雖盧醫扁鵲不能施其方縱妙藥靈丹豈能救其困丑時第九寃結不解下下秪爲生荆棘豺狼及子孫一庭燈燭夜灰冷半星存荆棘生於怨惡禍及子孫狂縱起於侈淫害臨自己燈燭夜晦暗中用事事不可明火存半星灰内求然然不能熟丑時第十倍獲厚利上上水高船自高應手未嘗勞已覺多多辦誰能較爾曹月明風静對秋月自現光輝水長船高得順水不勞撑駕多多益辦如韓信之將兵未嘗辭勞若孔明之竭節丑時十一大宜遷擢上上不是文章貴安知望外遷若論清要地身近紫薇垣文章高美名標金榜之中學業精微身貴玉堂之内職居清要之地恩寵日隆身近紫薇之垣光華易顯丑時十二有虚無實下下無形空抱影平地生贅疣羈絆從我出何日消百憂無形安得有影影自何生無水焉得生波波從何出虚中無實事必是於妄傳實中有虚言必從於外説丑時第十三久困漸安中平困龍久蟠泥山低虎徑迷漸攀雲霧出紅日未平西蛟龍未得雲雨困卧幽巖豺虎迷失山林潜伏草莽君子凡居養道道亨則進達必通士入脩業待時時至則功名自顯丑時十四旅隔不堪下下多病幾時甦煙波隔遠途馬疲人又困殘日嘯猿狐心不樂如患淹留之病事不遂若隔巇嶮之途馬疲人困不能進而不能前列日猿狐不可行而不可止丑時十五貴人扶助上上一箭降清霄途行逢馬牛輪車通寳貨風急送行舟求名取禄遇薦舉而進身蹈困途行得駿而堪代步寳貨盈而車輪快速急若飛雲風水順而舟楫穩平疾如奔騎丑時十六進退兩得上上一馬過前山金烏照遠關高低無阻礙歌舞映容顔金烏升於天漢照下朗明駿馬疾如追風前程通快欲上欲速高低皆可攀躋欲進欲違上下並無拘執丑時十七前程失望下下大雅何時見斯文幾日亨秪因愁白首捫腹困諸生文章踈謬更無科甲之名大雅荒亡空有留連之樂望功名而挫失白首無成嘆學業以蹉跎年華已老丑時十八安静有得中平安分第一機方識静中碁莫滯心頭鑑從他細管窺澄心静慮如通心下之機定志頤神方識琴中之趣棄塵緣而勿滯鑑自分明修圓覺以參微惠光自見丑時十九作爲暗昧下下佳人恨掩門情隔不相通進退全無圫難尋正路蹤佳人有恨慮防陰小不寧情隔不通多主行藏蹇塞暗昧事牽纒不已進退兩疑幽悶懷縈撓無休憂喜不定丑時二十失事無成下下身在急難中猶誇意氣濃笑他無活路人鬼怒相攻人居患難當修善以消攘事在窘危宜謹心而避畏誇雄豪而不知命分挫失猶多生妬害而欲損他人鬼神共怒丑時二十一意外有喜上上雲外降天書門多長旨車香添蘭室味携手入蟾蜍丹書天降則思寵之光榮長者車臨慶門庭之賢貴事遂意如入芝蘭馨香之室謀稱心如登廣寒蟾桂之宫丑時二十二人財遂意上上寳玉貴珍藏年年粳稻香翠陰千里緑桃李自成行寳山出現貴尺璧之奇珍粳稻熟成慶豐登之樂歲事遂翠陰千里緑蔭清和財豐桃李成行花開結實丑時二十三聽時必達中平有物未周旋生涯難復艱天時任消息何地不閑閑人情艱阻如登蜀道之難謀事憂勞若渡峽江之險天時助生涯自遂可優可閑人事順謀用自周有消有息丑時二十四終有所濟中平久旱欲焦枯田園半有無井泉從地出當看澤來甦天久旱農力疲竭田裂紋苗稼焦枯偶井泉湧出地神力扶而旱不爲災忽甘澤沾濡天意救助而秋必有望丑時二十五災去吉來上上花發又花殘悲歡一半顔十分留晚景新意到人間人有悲歡離合花謝花開時有否泰蹇亨月圓月缺當其晚歲忻逢冨壽慶康寧正植桑榆喜遇春和增快樂丑時二十六諸事漸亨中平祈福可偷安隨緣意自寬門庭香火供無事也清歡省過則災愆自息諸事漸亨隨縁則妄想不生百魔降伏精祈香火香火旺而神力堅自樂清歡清歡多而道心足丑時二十七平平有得生涯付倘來顔笑逐時開隨分春臺樂天然獲寳財冨貴功名身外倘來之物死生壽夭命中注定之因寬其心者喜慶多而病不生安其分者熙然樂而災不染丑時二十八望事羈蹇下下人老又蹉跎剛須口吻多平地猶有觸動得鬼神呵生涯蹭蹬徒嗟人老花殘術業蹉跎謾嘆時遷歲改履平地若有坑有坎觸處風波舉謀用則無功無成人神呵責丑時二十九忙失故道下下心折已堪傷窮途暮復長望人人不助知有幾回腸倉皇失措心百慮以堪傷路阻途窮意生縈而堪恨道既失人情寡助空自回傷事不遂親者乖踈謾勞役慮丑時三十所求稱心上上青牛負寳財良馬出龍胎異夢生英傑翔飛應上台青牛負其寳貨力載萬鈞駿馬生於龍胎日行千里英傑出世應三台嘉應之祥功名遂心達四方契合之美寅時第一非常之遇上上不是飛蓬客新開天上雄凌煙倍聲價華寵揖三公人之濟遇平地可以登仙事之得時談笑可以獲禄非常者不期而會喜躍歡生王公者利見大人恩華寵遇寅時第二勢孤援寡下下鼎沸若狂波孤舟要渡河異郷無故友人事拂天和鼎沸之心謾有吞舟之大志奔趨之勢更無濟渡之扁舟若孤軍絶援於堅圍如羈旅無寥於異域寅時第三小人道長下下冰霜寒裂膚戎馬困長途患深蜂蠆毒秪自歎泥塗履霜堅氷寒非一日浸潤膚受毁非一朝僞説巧言之謗深於蜂蠆之有毒讒語佞口之非甚於犬戎之爲害寅時第四君子道消下下否剥數時窮陰陽窒不通獨謀寧獲助紅日蝕長空天地閉塞曰否否則有迍陰陽差謬曰剥剥則有咎既否且剥君子所以道窮陽挫陰差小人所以道長寅時第五小事契心中平胡越可爲家芝蘭味更佳雖無霜雪幹且喜傍墻花合而不離曰契胡越可同美而不亂曰佳芝蘭並室雖非比於松栢傲雪凌霜亦可慶於芳菲賞心悦目寅時第六改故則吉中平業垢礙前程好邪事不成但存公直理咫尺契神眀路無荆棘之所礙大道可行事有纖芥之所疑虧邪勿用宜改宜革吉福漸次來祥存正存心神明目然垂祐寅時第七奮躍亨衢上上珍藏幾年功一夕氣吐虹北斗寒無翳請看三天鋒奮於學者必有成功之望奮於志者豈無騰逢之時神鋒三尺熒熒掃蕩千邪北斗七星凛凛斡旋造化寅時第八先悲後吉中平春風雖未濃空想舊顔容直待秋雲捲日明重又重春風始生和氣萬物未萌秋月方見月輝百祥集至若占望則先晦後明明而方遂凡用事則初否末泰泰而始生寅時第九内外失助下下居家睽六親忤物又妨身動摇不自得舊跡幾時新家庭擾擾親者踈而愛者離自身惶惶智者愚而七者拙失助者弱力而荷千鈞焉能負載遠動者巨浪而漂一葉豈能平穩寅時第十人財不安下下有慮親鄰隔無財力漸疲强生分别路何處覔平夷慮近不可不慮正若比鄰財損正恐失財一如竊好分别者道險路危則坦平未見不安者心離事阻而乖異並生寅時十一驚憂失宜下下龍卧明珠失虎行人跡空何時得安枕驚慘夕陽中虎無爪則威令不行困居幽谷龍失珠則神能頓減默隱深淵驚懼如臨棘座之中愁慘若卧針氈之上寅時十二騰達有望上上高攀龍鳳姿豈似鷦鷯兒平地皆煙雨一夕游天池鴻鵠之志豈從燕雀之徒鵾鵬之才焉與鷦鷯之比飛黄騰達於萬里因高貴以提携奮發逍遥於四溟得躋攀而稱遂寅時十三望用得財上上一着已先機碁分黑白圍大江逢好渡展翼却高飛謀事有若變碁算在前而成在後進望全如射弓端在此而中在彼津渡得舟更勿憂乎不濟飛騰助翼何勞慮其不衝寅時十四先虚後實上上雷發震天衢陰雲密不舒忽然膏雨至霈澤領天書霶𩃱雨降必布靉靆之濃雲恩禄寵臨必先勤勞於王事膏雨至蘇田潤物歲稔時豐丹書賜褒善美功道高德重寅時十五人事不和下下樽酒謾追隨花間争是非解寃寃未解争柰小人欺因杯酌而生譏誚立見喧争防談笑而變是非坐遭吻舌因而成怨怨結重若丘山造次爲殃殃深積如滄海寅時十六事慮非厄下下屋裏慮添蛇馬嘶空自嗟炎炎煙火地紅日障雲遮騰蛇遶宅門户豈得而安羸馬嘶鳴行人焉得而至火炎空而虚驚將至晝謹夜防雲遮障而暗昧恐臨日憂夕懼寅時十七漸收天信上上離亭久索居雲隔鴈來書昨夜燈花結明朝引玉琚羈旅天涯久絶一音之好征鴻飛至忽收萬寳之書燈結重重之蘂喜信臨門鵲鳴切切之聲佳音入户寅時十八往而獲吉上上欲速尚遲遲投機自釋疑緑深溪岸穩何處不相宜躊蹰未决欲進或欲退去處兩疑待舉又時默幸有壺天之景色遍賞何妨殊無絶地之閑憂暢懷何礙寅時十九事無疑礙上上玉鑑塵無染金刀利可裁天然成美事争得惹塵埃鏡瑩淨則可以鑑容妍醜乃分刀快利則可以裁物剛决乃應塵埃不染紛擾障礙已除美事欲周悦懌情懷始暢寅時二十臨事疑滯下下隔岸聞鳴鳥道途隔幾灘神呵猶自笑無路到仙壇鳥鳴獸吼徒生吻舌之音道阻途迷忽起嗟嘘之歎神呵者怒而不恤愆重過深路絶者往而不通道微德薄寅時二十一失財不律下下多聚還多失尋財事更遲歸有如醉夢閑慮却愁思貪歛之人專務得而還務失欺邪之事不獲吉而必獲殃心事倒亂昏昏醉夢顛迷念若差迭擾擾愁思縈撓寅時二十二人財虧損下下烏飛不可追雲雨暗垂垂尋真還失路何處不堪悲烏飛兔走日月逝而莫追雲暗雨垂天地暝而難曉尋真失路仙不遇而道不成獨處悲傷利不獲而名不遂寅時二十三晚貺可望中平鐵硯費研磨淹留争奈何㠶開秋漲闊牛女渡銀河功名未遂磨穿鐵硯可爲時運未通用竭機關何益須待睌逢佳貺秋色如春達然老遇昌時衰年還壯寅時二十四遇知見喜上上久久困泥沙星金散作花借他良匠手鼓舞出黄芽真金用於泥沙非陶鎔則不能成器美玉隱於頑石非琢磨則不能别真黄芽出土遇真仙白壁生光逢良匠寅時二十五作用通快上上青雲年少功壯氣常凌空用事已得時高飛出樊籠雲梯高步蟾宫折桂之秋舊意飛騰霄漢凌空之際通快者前程坦率去路迢遥得時者濟會方通情懷舒暢寅時二十六事過空亡下下敗北不堪論山高日又昏馬奔人失望煙火一家村山高日暮乃懷憂抱慮之時敗北亡師乃挫鋭失鋒之意事不濟則空勞志役馬走人奔道不行則謾設機謀煙消火滅寅時二十七病患臨身下下夢想更添愁無情人更憂何時尋勿藥回首幾經秋心多惑則夢想不寧志多役則神思散亂孜孜之欲豈無坎坎之憂戚戚之求必有綿綿之患寅時二十八恬退可保下下安分方成泰奔波必遇迍屈伸知有道喜入笑眉顰安分者可以知止知足恬養者可以保命保生静中守静亦可屈而亦可伸迷中又迷必致迍而必致否寅時二十九小有知音中平庭外已虚心忽聞鸞鳳音斷金知有意當認伯牙琴虚其心者殊無縈惑之憂聞其音者知有鸞鳳之瑞斷金者逢議讓之華風調琴者遇知音之交友寅時三十功名際會上上朝遊荷花湖夕上凌煙閣壯志歌此行馬蹄侵日角道德就則遊宴十洲三島功行滿則逍遥四海五湖勳業俱盈名可標於凌煙壯志峥嶸身可攀於麟鳳卯時第一勞心有望上上羊腸危百結世路實多艱禄馬相逢處雲霄可自攀事多過慮心萬端而腸百結世路艱辛道未亨而力寡助先歷風霜之險阻得意勿驕次逢禄馬之扶持稱心勿慢卯時第二再求有望中平重整亂絲頭新修急峽舟若逢春後澤花柳一時抽路頭未達一重水過一重山謀用未成亂絲頭續亂絲尾弊損之舟再整可濟瞿塘甘膏之澤復還霈新花柳卯時第三事防重疊中平心緒亂如麻浪看花後花何時勤拂拭回者故人家紛紛之擾一事去而一事來衮衮之波一浪退而一浪進拂拭者辟除外事小吝自消回首者改悔前非大虞自息卯時第四事多障礙下下白頭人未老多苦更枯腸逢處皆荆棘何時憂自忘人猶未老先言白首之悲事已凋殘謾起枯腸之歎當道有荆榛之礙進步不前去路生顛覆之危奔趨不遂卯時第五望用稱心上上有意出機先相逢不偶然職名皆得地花錦到平川籌畫之機用在前而成在後職禄之事向則吉而趨則亨得地者景貺如花如錦相逢者縁契非偶非然卯時第六家道吉昌上上桃李照門庭溪山遶屋青天香凝不斷風物逐時新春色芳濃桃李有芳菲之景秋光明浄溪山無埃昩之塵天香一爇散蘭之氤氲風物初新保家門之福慶卯時第七欺昧不明下下玉石已難分奸邪不可論怨從陰毒起蛇鼠自相吞佞人讒已雖眀哲不能保其身陰賊害人縱賢智不能免其毒美玉頑石真僞尚未可分君子小人邪正猶未可識卯時第八資助有得上上去去莫遲回天邊步斗魁一嘘吞巨浪走馬借聲雷去路坦然勿舉遲回之意來祥助順必昭星斗之光巨浪興因風力而吹嘘密雲起得雷音之聲勢卯時第九事多虚詐下下有口只談空無情强不同笑他人獸面翻覆雨雲中僞談飾説聽之者其巧如簧詐語虚詞味之者其甘如蜜輕信寡諾秪知表而不知中人面獸心朝生喜而暮生怒卯時第十事遂功成上上九轉就丹砂平吞日月華真如龍虎妙天地一黄芽金丹妙藥無非九轉之功冨壽康寧乃是五行純粹天非雲障日月現於光輝人有道心龍虎聚而欽伏卯時十一道果圓成上上仙骨比喬松靈丹認葛洪鶴聲雲外急人在碧霄中道骨仙風可比喬松之盛龜齡鶴算可同磐石之安功行滿得爲雲外仙賔道果圓堪作蓬壺羽客卯時十二安分有成上上樽酒惹閑狂誰家蝶夢忙惺惺當自覺秋後更時長損真亂性有如畢卓貪杯迷意惑情全似莊周夢蝶惺惺者宜早有覺曉岸清風賢長者安分知機暮天月朗卯時十三人離財散下下魂夢逐雲飛行人歸未歸馬奔人亦走空有淚沾衣雲飛天外夢魂散以無蹤鷗泛波中人財離而盡失馬牛奔而駕馭不止事亦難追涕泪流而悲感自生情亦難爽卯時十四家宅多凶下下不覺斷蛇傷鷹飛難整行鳥啼春雨後人在日中忙鴈失行手足不利兄弟乖離蛇傷斷骨肉有憂夫婦刑尅鳥啼雨後空嗟滿目花殘人在日中自覺一身影亂卯時十五神明扶祐上上事業誰無報陰功信有神飛騰今有路一舉謝埃塵施陰德者必招陽報行善事者必感福臨上可以超宗拔祖吉慶所以流傳下可以廕子榮孫神明所以扶祐卯時十六望外有信上上燕子落天邊行行鴈信傳未期心外事紅緑已聯翩春光淡蕩燕傳熙喜之音秋色澄清鴈報佳祥之信望行人忽然而至花綻嬌紅占用事坦然而成柳敷陰緑卯時十七先滯後快中平雨脚暗山前行人出未還待他風力捲明月照紅顔雨意濃而山路險行人阻而音信稀漸次雨散雲收便覺舒情而快爽須臾風清月白始知發笑以開顔卯時十八人財不寧下下閑慮苦駸駸驚波逐此心無言空抱恨人鬼怒相侵憂疑不决者謂之慮其慮惶惶暴亂忽至者謂之驚其驚擾擾心緒不遂則抱恨無言人事不和則陰鬼謀害卯時十九前程通快上上柳陰方濯濯松幹已峩峩着意春無盡東南興最多竹身松幹不憂霜雪之侵凌槐影柳陰正遇清和之景色幸有東君之着意朽壤須榮不妨朱夏之熙遊情懷必遂卯時二十得人扶助上上中流似失船賴得一壺全更加風濟岸輪月照青天船至中流有失死在須臾賴得有人救援生於傾刻順風濟岸心始寧而事始安紅日昇天昏得明而暗復朗卯時二十一前程得地上上情通濯錦川帝里又開蓮盡是超騰地披雲望九天情通道泰玩觀錦綉之山川功遂名超榮耀王都之帝里飛黄騰踏心不顧於蟾蜍雲霧披天身可乘於鸞鶴卯時二十二事多乖悮下下平地障雲山朦朧不可攀怨多空掩袖咫尺隔雲間雲山曡疊始知途路之遥月影朦朧難折廣寒之桂積怨多人懷恨毒舉措隄防契分淺事繫乖訛行藏顛錯卯時二十三小疑有成中平紅雨濕桃腮離情莫怨猜春風如有待生意又重開桃腮杏臉不禁驟雨狂風矯意虚情不必怨猜離恨春風至芳萌再發釋去閑疑小用成欣笑重開驅除念慮卯時二十四事無定準下下身似一浮漚隨風柳絮遊波瀾猶未止何處覔蹤由一身有似浮漚忽爾生而忽爾滅萬事有如飛絮或時聚而或時飛進望如木上出没之漚謀事若風中顛狂之絮卯時二十五必獲異寵上上鳴鶴在前途鴛鴦叩玉壺天厨應自設忻得貴人扶鸞鶴飛鳴已遂逍遥之志鴛鴦對偶相期寵愛之歡天厨設上品之珍羞貴人扶陰德之相助卯時二十六决策必勝上上籌策孰爲先人才第一賢寵奇當未艾千里獨加鞭機略之妙謂之籌知鬼神之情狀料度無義謂之策决勝負於有無二事俱備取勝之道不難千里加鞭立功之宜必易卯時二十七口舌相凌下下言行兩相違空論是與非不知榮與辱輕在發樞機宫行相合者謂之君子言行相違者謂之小人毁真亂正逢天誅地戮之愆尤反是作非遭扙舌耕犁之果報卯時二十八所求可望中平行意莫遲回重添别後杯莫憂人影瘦庭月照江梅意思遲回多是累逢屯挫重添杯酒豈非斷續歡忻人影清瘦必然先見於憂懷月照寒梅乃是晩逢於佳貺卯時二十九喜慶有漸上上缺月未圓時看看桂子垂馬蹄雖未快喜笑入雙眉新月初生漸有團圓之影馬蹄緩步豈無馳驟之心占名位從小至大恩貺重重占財禄從窄至寬歡情疊疊卯時三十骨肉離散下下孤鴈失無群哀鳴不可聞望伊伊不見遼邈幾重雲鴈失群夫婦有喪偶之悲聲哀鳴兄弟有别離之歎占骨肉者則主生離死别謀動用者則有惹患招殃玄真靈應寳籤卷
