front:
  text: 玄真靈應寳籤卷下納四
  hash: sha256:3b20d5f04cab6e17509bdd50180c8bb1a14ba1dab00e6211712be7496ccc3dfe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0108_SJB_003-320793c, image: sjb/32/320793c.png}
body:
  text: 申時第一待時可時平平渺渺天邊鵠乘風萬里飛更無霜雪阻秋色滿庭幃天邊之鵠風力健則飛達雲霄塵世中人命運通則顯榮超遂時未遂則潜而勿用命運通則守而自亨申時第二得意遇時上上皓月洞庭秋乘鸞汗漫遊玉壺天地闊已脱苦淹留明月清風况對洞庭之秋色乘鸞跨鶴何妨汗浸之清遊玉壺潔浄更無半㸃囂塵仙洞遐長已絶有爲之快樂申時第三喜信臨門上上火煉始成金真光現寳庭駭然爲一信忽爾報佳音烹金琢玉乃成大寳之珍煉性修真必有昇仙之分佳音至天降異常之喜慶美信臨人生踴躍之歡欣申時第四佳報奇遇上上燦然星斗交寳劒氣凌雲别有真奇遇終身滿國聞寳劒凌空上徹斗牛之色旌忠輔國下鎮夷狄之威一時際遇遇則峥嶸千里播聞聞則超遂申時第五望事不成下下玉碎不成琢金潜豈可烹惜哉奇遇士迤邐暗中行玉簪將就已成中折之悲執釣得魚忽有折鈎之歎因縁事遇而不遇一笑而空謀望事成中不成中輟而止申時第六决疑成事中平水清魚可見智明情不知幸無昏濁昧何用强猜疑水中静則遊魚可見智内敏則情僞可知既無蒙昧之欺當决狐疑之慮舉一事須成就謀一用須去疑申時第七守道勿用中平大道本無礙真光照眼明守心能守正神鬼亦須驚大道無名本無拘無礙真光有象可能照能明心若正直神不干而鬼不欺性若圓通仙可學而佛可作申時第八惱事漸消中平群心亂生忿衆心空憂牽從他機巧用舉步自安然僣亂者必遭君子之刑忿争者必受小人之辱人事乖違衆情不順久而自消心意隱忍百病不侵久而自泰申時第九退憂成喜上上赫赫陽光發沉沉鬼魅消滿懷幽興盛一掃意超超日昇天則陰邪自然潜匿命運通則灾害自然消除縱生慼慼之憂懷當有欣欣之美遇申時第十守正戒非中平人頭三尺上神物自相隨昧事休生意防心切自持天雖高而聽甚卑神雖幽面察甚明意欲妄舉豈無暗録之愆尤心宜自防必有明彰之福報申時十一憂散成喜上上風月滿高樓提携可恣遊開眉展愁腹樽酒醉方休樓臺風月正堪良夜之歡身世康和勿負佳期之約散憂懷於物外眉展心寬列樽爼於席前歡天樂地申時十二得禄有望上上天禄賜堯階丹書降玉臺欣然無限意花向故園開堯階賜禄得瞻天地之恩光故圃花開復賞芳華之景色職位有欣欣之喜慶家門無坎坎之非虞申時十三危中有赦上上羸疾自天降昏迷日醉沉忽逢天上士寳餌賜玄靈顛危之事恰如病在於膏肓迷亂之心何異醉沉於酩酊非扶持不可以救困濟危非妙藥不可以却災療病申時十四迷中有指上上寒灰氣已消志識更飄飄得遇至人語分明指路遥至人妙語頓開迷悟之心長者提携指引亨途大道寒灰滅燼餘焰復燃枯木凋零舊枝再茂申時十五謹身防失下下朽索御六馬常須謹步行倘然微縱放必致禍臨身卒暴之性豈無顚蹶之危朽敗之繩焉繫奔衝之馬性縱逸而招禍必累其身心警懼以免殃方成其福申時十六舉措宜謹中平百尺高竿險休宜縱此心行藏須把捉方許得安平登崖雖險常懷懼亦不致危平地雖安縱放性豈不招禍謀望事未成未許役志勞心行藏事始吉始安修身養命申時十七謹身守正中平萬頃清江静一天星斗寒扁舟行正道謹懼渡波瀾謹身謹行不可少頃離守正守心不可跬步失不謹不畏澄江忽起於風波違正道必誠玉自投於水火申時十八舊幣重新上上一喜自天降庭幃起壽萱豈知殘户牖復爾再新垣重開户牖鼎新革固之時再整墻垣修弊補殘之意謀新理舊二事皆可諧同望禄求名一喜俱能稱遂申時十九勞中有逸上上旱魚方得水病虎入山林漸漸有生意悠悠快爾情放旱魚而入深淵洋洋得意縱病虎而歸巖穴漸漸生威勞役者有縱逸之期勤險者有豐饒之望申時二十先難後遂上上百戰事多危功成凱樂歸錦衣回故里勳業事高彌不祥之器孔子號曰佳兵决勝之謀孫子言曰妙計功成勳就先經百戰之危衣錦凱旋次受封侯之賞申時二十一感真遇貴上上九轉靈丹藥三山玉掌仙一時來降集災散福綿綿靈丹九轉服之者羽化登仙蓬島三山到之者逍遥快樂玄真降集福慶保於家門高貴提携名禄登於爵位申時二十二忍忿待時中平擊鼠雖防器觸邪仍避真不宜先忿躁徒恃可成名鼠臨玉器之傍擊之者必損其寳語犯惡人之怒觸之者必害其身能隱忍忿事自消若待時謀事自遂申時二十三大成小吉上上楚玉逢良識真金煉得烹已能成大器不礙小忿争黄金白璧因烹琢而能成寳賢才君子懷學業而可成名良謀得遂大器所以晚成美事既修小忿何能侵礙申時二十四謝恩得禄上上小禄尚徘徊東君意已隨願將香火信遥達上天知徘徊者必有進退之心東君者已得提携之意廉謹守節禄可永而職可陞香火嚴恭神可扶而真可助申時二十五舉語可成上上照膽觀心事明明自可知君能開一語攀接兩相隨忠心義膽天可察而神可知妄意邪謀鬼必禍而神必紏既寸心坦然無憂無謟若一語合矣可順可從申時二十六此急彼緩中平此望若思渴彼情如蹈淵忽然風雨霽飄駕上青天大旱望霖未有滂𩃱之甘澤急趨迷徑正當差跌之多岐此心急如懸鼓而待槌彼意緩若停碁而思着申時二十七難中有救上上一夕風濤起舟人意不生賴他心力助道德復全亨乘舟行水暴風作而波浪彌天處世立身狂悖興則功名掃地拔患難乃神真之助力獲安泰縁道德之崇修申時二十八慮心漸解中平有意自生憂無緣脱滯留但能安意志何事不相周憂疑出於縈惑慮起千端幽滯在於淹延愁生百種安其意則狐疑漸次而釋寧其心則悔過迤邐自消申時二十九望事返覆一志苦相執狂心殊不知待他成計日反覆已經時執迷之志將爲必取之功指擬之心却乃虚無之失待他者空有懸懸之望進退再三經時者殊無肯肯之心反復不一申時三十求信有成上上鴈信欲通傳誠心利後先上人能一語美事十分全鴈足魚腹能傳千里之書良語誠心可助十全之美占遠信信不虚傳傳無譎詐謁上人人受實惠惠有恩光酉時第一謹身勿縱中平仙友在重關千山與萬山謹心乃謹事歡笑勿追攀訪朋求友不勞涉水登山養性修真先要戒貪絶欲心宜常謹謹則無失無憂意當去奢奢則不固不遜酉時第二有路可進中平有徑不相阻無門不可關非爲他妄作千涉事須煩屈曲之徑非盤折則不可通宛轉之求非周旋則不可就事再三而方遂勿憚其煩意進退而始周即非其妄酉時第三悖理有吝下下理財理事遲鬼賊見其機勿共同心事防言變是非理財理事財不利而事不成理訟理婚訟有虧而婚有破况鬼賊侵欺而有陰謀之逼防語言變詐而成屈曲之非酉時第四謹防小人下下彼意有所害此心殊未然更防樽爼上外事恐相牽彼畜害我之意言且和而貌且恭我無防彼之心行不知而坐不察防杯歡而生仇怨戒僣易而恐牽連酉時第五失馭生迍下下玉石不可煉丹砂不可沉倘非當處用寳器不全真玉石至美不可火煉水烹心雖至明不可無懼無憂失馭則駿奔遠邇難追縱放則迷逸顛危難返酉時第六棄利遠害中平舊事不宜舉舉之必被連目前當棄捨身後得家傳既往之事不可舉舉則返害其身鋒刃之蜜不可嘗嘗則必傷其舌棄其小利大事必成利其下人上情必順酉時第七静守防心中平天外月華清雲中有鴈鳴寂然無一事不可舉私心静其心六賊不動五藴皆空防其心百魔自潜三毒消滅狼虎雖曰猛獸由可誅擒善惡出自於心自宜降伏酉時第八輕信寡諾下下宿諾幾千番徒勞反覆間面前雖笑許心復事多般所懇所求之事雖至切而至勤所允所許之言却多虚而多僞卑辭厚禮此徒費於精神諂笑迂談彼常飾其奸詐酉時第九先勞先遂中平二子本一事兩情剛更推鼠牛相促迫虎兎見熙熙二人同其心者義可分金二人異其志者事無協濟子丑發用正當役役之勞心寅卯合辰方有熙熙之喜色酉時第十先詳次用中平行步先防險乘舟預備風豈宜倉卒辯不必問窮通事無巨細宜三思而後行動有吉凶當賔詳而始用趨行步走猶防顛險之危求利圖名焉可倉卒而辯酉時十一疑事勿用中平幽昧未能知求名叩聖機自宜生揣分疑事不須爲幽暗者不明之象人莫可知疑惑者昏亂之端神不可曉揣分棄而勿用用則難諧待時必自有通通則可久酉時十二怨解讎釋中平夙昔有嫌疑兹來怨釋非不須多忌諱仍以禮和之小嫌不除將有大怨小怨不解將成大争嫌疑之意非自釋不能寬其心忿争之端非隱忍不能和其怨酉時十三遇事可求中平幽室有淹愁人生水上漚逢春須得遇休且强遲留人生處世如水上之輕漚謀事未周若困居於幽室得遇陽春少展永淹之志幸逢良便休更强自遲留酉時十四欲速上遲中平聽聞唯未見遇否尚難知欲進非能向從他意所爲千里傳聞多有虚而少有實一時遇否難所信以難所知事欲達尚未可達心欲速尚未可速酉時十五進禄可陞上上天地降洪恩人神共仰欽光華歸有道仰視福來臨天地恩隆輔有道而助有德人神欽慕仰無愧而俯無慚禄位進陞共慶重重之喜官班遷轉拜瞻疊疊之榮酉時十六遇事宜進中平群鹿在山林仙花滿徑春正宜時進步勿更滯空樽鹿居山林攸伏濯濯之性人生俗世貪求戚戚之心對仙花之爛熳進步勿遲逢麗景之融和空樽勿滯酉時十七出萃成用上上仙桂發新枝蟾蜍用正輝拏金伸我手談笑得蟠螭手攀仙桂始酬三學之勞步入蟾官方稱十年之志展拏雲之大手拔萃超群獲龍頷之真珠身榮名貴酉時十八天貴用利上上土木著朱衣相逢意自隨不妨開一語扶助上雲梯至親者父母兄弟所倚者君子貴人非父母不能生其身非貴人不能保其禄貴人助順可陟雲梯君子扶持能成美譽酉時十九先進後成中平一者是非公三心意不同勿交先下着勝負在其中一事始用或云是而或非三意不諧或多乖而或多異須是先宜速着勿使後時無令彼在我前恐或迫悔酉時二十謹機用事中平各各意難知機深用最宜勿令輕漏泄必致是成非機事不蜜則害身謀事不謹則累已雖同濟而干涉各懷意以難度難量蓋所見之異端彼此情而莫達莫曉酉時二十一擇機防失中平東南路可行西北恐成迍用事先達利切要自安存東南春夏乃生旺之吉方所以得朋西北秋冬乃肅殺之否位所以喪朋度其事可以行則行審其謀當用則用酉時二十二用心必成上上欲覔深淵寳當求頷下珠必然成底事不用自躊蹰深淵之寳用智取而必獲龍頷之珠當猛求而可得心誠堅則可成佛作祖解悟何難意躊蹰必是敗道虧真追悔何益酉時二十三失信絶音下下渺渺隔天涯斜陽噪晩鴉空中絶音信默坐使空嗟天涯路渺更無一鴈傳書夕照幽庭空聽群鴉噪晩所謀事如空中捉影豈可而搏所望事若海内尋針焉能有獲酉時二十四先優後喜上上缺月又重圓雲開復見天醉懷今再醒敗事更成堅雲開天浄一輪皎月重圓憂散喜臨往事離而得合醉夢醒魂神清浄燕處超然邪魔退道氣常存冲和逸樂酉時二十五安固久遠上上夙怨已除决新恩來又别久久意如何青松奈霜雪施恩惠已消宿怨退禍消殃布功力而受新恩迎祥集福青松緑竹傲霜雪而耐歲寒堅固保安養形神而增禄筭酉時二十六福德兩助上上綵雲天外飛仙音一派隨吉祥又喜慶延福更延禧有福者必要有德其福彌高積善必要積功其善彌重喜祥凝集簫韶仙樂常音福慶臻華瑞藹綵雲常覆酉時二十七家神不寧下下香火一蕭踈家門鬼賊窺自當修浄潔方始得安居香火精專真有術而神有護家門喧鬧鬼有虧而盗有謀正身潔己始有滌於餘愆謝過禳灾方且獲於安泰酉時二十八憂事成喜上上羸弱復康强災殃變吉祥小人空計畫大德自昭彰重病漸次而愈復爾康强浮災迤邐而消再逢喜慶陰謀一退如雪影之無踪照朗重明若日光之普鑑酉時二十九如履霜氷中平忠良士已成浸潤事何迍幸得高人見閑非已化塵忠良之士尚不免於讒言賢哲之人猶自遭於譖語欲止其謗者莫如正己修身欲戒其非者當以省心改過酉時三十久誤方甦中平緣木欲求魚徒勞志已虚分明山下路咫尺是前途妄求之欲有如緣木求魚越分之謀何異鑽氷取火當自回心默省今者悟而往者迷宜交覺念參詳醒者清而醉者濁戌時第一徒勞心力下下折足鼎何施安排必見危笑他群下口一事不能爲鼎之折足不可立立則傾欹事之虧理不可行行則迍蹇傾欹則危而不穩上意乖踈迍蹇則撓而不安下情喧吻戌時第二困中有救上上枯木始成用雪霜多見摧一朝春得意忽爾變芳菲積雪嚴霜之際葉墜林枯逢迍遇蹇之時心灰志懶幸陽和布氣而着物林茂木榮得意人提携以扶持困消厄解戌時第三因人借力上上車轍有所礙前途尚見遲忽然人着力舉步上雲梯巨石礙轍雖孟賁亦不能挽其行猛虎當途縱卞莊亦不敢進而去人去石轉有轟轟之勢神庇虎行無慊慊之憂戌時第四計劃無成下下夢斷魂亦消悲心起寂寥許多良計畫風雨更蕭蕭魂消夢斷思百計以無成慮亂心迷舉一謀而不就對寂寥蕭蕭夜雨獨起悲心暗咨嗟悄悄西風轉生悵恨戌時第五謹身守道中平危除過重山豺狼日共班且將低曲折未可展愁顔幽谷深山居處步險心危豺狼虎豹立身日夜憂懼宜謹謹隄防勿縱危中始安常慊慊和忍常恭憂中變吉戌時第六守静待時中平萬籟已澄清月華光彩明且將詩酒興餘事勿關情萬籟俱息月華朗而宇宙清百慮皆消魂神静而神體爽快遣興何妨於詩酒物外逍遥守真如不礙於謳吟箇中快樂戌時第七隄防姦詐下下三女事宜防巧言爲亂常守心休自縱牛馬退災祥奸人惑正不可測而不可度僞言亂真必是詭而必是詐順情者不可輕信信則悮人悦己者必要隄防防則免害戌時第八積功成道上上九轉靈丹藥功成非一時欲求無上道先下死施爲功不積者不可以成道藥可煉者方可以成丹修行累世名摽金簡玉籍之中習業歷年身步青雲紫霄之上戌時第九脱危成慶上上賢達乃真儒猶同脱釣魚躍開千尺浪一餌不能拘賢達之士不爲小利之害身谷舟之魚豈可一餌之拘執錦鱗脱釣躍踊巨浪之中君子出災快進亨途之上戌時第十守正福佑上上蕩蕩乾坤大巍巍道德尊處身當正直功遇自心存乾坤廣大善惡報應無私道德彌高邪正操修皆見心正念正福佑自臨心邪念邪吉祥自退戌時十一戒奢防禍中平尺水豈能波量微福戒過自前宜撙節來禍必消磨牛泓之水地步淺豈可興波窄量之人胷次慳焉能容物吉福生於勤儉儉則豐腴禍敗起於淫奢奢則狼籍戌時十二守道勿用中平浮華能幾何回首勿蹉跎守業休閑縱狂心勿更波浮華易過渾如夢斷南柯盛事難逢謾歷時遷歲改道業勿令放縱返照回光安心切戒蹉跎少憂無禍戌時十三所事不諧下下水火兩相非小人君子機不堪同處樂去就必難爲氷炭不同鑪蓋有相生相克薰蕕不並載蓋有相染相污君子有寬仁惻隱之心小人無遠識高明之見戌時十四失迷得遇上上奔趨路失岐心懷正此悲仙音嘹喨起方始見光輝心迷誤則路頭蹉跌意愴惶則舉止乖張顛危得吉人點悟良言如聽仙樂險阻遇貴人提挈重瞻天日戌時十五遇如不遇下下萬寳積如山行人不遇還空將心智術一笑夢魂間人不積善如入寳山空手回道既寡緣得遇真仙無眼識機會臨而失搓智術空談好事遇而乖差營謀無用戌時十六憂事未解下下騎虎勢難下隨機旋旋行一朝能脱灑快我志平生登險崖心不可逸逸則害己騎猛獸勢不容下下則噬人正此憂懷宜且謙恭而待物次須脱灑始知散慮以逍遥戌時十七用事未達下下薄霧作濃陰天昏未得明行人空嘆息去路尚多程濃陰作晦不知昏曉之天索手登程忽陷沉迷之澤謀未達去程多阻水隔煙村人尚阻味况不甦雲遮隴陌戌時十八離事重遇上上一别幾經年相逢事偶然重開樽俎興歡笑再綿綿故人惜别相逢樽俎之歡寶月當虧復有團圓之意事際遇易知返掌笑逐顔開時通泰順若推輪喜從天降戌時十九用事再三中平三謁方能遇一言那便回再三行底事方得笑顔開扣關三謁不辭往復之勞事非一言豈便無從之許雖再三而至懇終必有成當守一而至勤事無不就戌時二十信息臨喜上上雲中鴈陣飛信息始重知坐待回音至行人咫尺歸鴈足傳書喜得雲中之美信魚腹尺素欣逢水内之佳音坐待者歸期之不遠咫尺者旦夕而可臨戌時二十一出幽得遇上寳赦降天來幽關鑽自開釋他愆與釁更賜利名回赦自天來釋其愆而宥其過福由真降保其命以延其生幽關破而拔萃超昇恩光臨而摽名賜禄戌時二十二遇人知己上上寳玉久沉埋光芒射斗回有人能鑑識幽現上仙臺騏驥困於鹽車非百樂而不可識美玉藏於頑石非卞和而不能知遇知己之士可以顯拔其身逢高上之士可以曉明其道戌時二十三妄語虚信下下妄語多言道虚無非實情傳聞空掛記終是不分明一人妄語衆人妄傳妄説者將無作有以假亂於至真妄傳者反是爲非以言惑於衆聽戌時二十四遇時得達中平百卉正芳菲春花爛熳時東君能着物何慮事留遲物不遇春則不能發萌吐秀人不遇時則不能展志舒情時之至也東君有着物之榮命之通也廊廟有陶鎔之賜戌時二十五亨通無礙上上改革得從新江山麗日明目前無限景嘯傲樂平生斗柄回寅革固鼎新之象春光着物花芳柳裊之時目前有景明媚則笑傲何妨心下憂悶頓除則熙遊何礙戌時二十六成名得禄上上拂拭更無塵衣冠學業新始能通大道必不負青雲靈臺拂拭更無一㸃之塵埃學業絶倫必取三元之魁首衣冠正欽仰尊崇之禮貌功業就獲取甲第之超榮戌時二十七不可合成一下頑石休將琢枯楊不可栽小人無大器往事豈能回器量小者不可以任大智識低者不可以談高頑石無玉琢磨徒費於工夫枯木無根栽植謾勞於澆灌戌時二十八憂事自散中平綿綿慮未休豈可見蹤由須待經時序憂波逐水流淹延不决者謂之慮禍患恐臨者謂之憂慮漸解如暴風掃雲憂自消若遊波逐水戌時二十九鬼憂心慮下下夜雨泣幽䆫風寒雨又狂不能成一寐餘事更堪傷幽䆫鬼泣慮邪崇侵擾於家門永夜風寒恐疾厄牽纒於陰小事紛亂則夢寐不安意傷悲則行藏不泰戌時三十前程通達上上鸞鶴兩逍遥風清月更高仙人相指引霄漢路迢迢造物純粹更無蹇剥之憂功行圓成必有仙真之遇鸞鵠昇舉逍遥於雲漢之中風月朗清澄澈於乾坤之内亥時第一守道得真上上妙語不可得真仙豈易逢一心能信恪八達自亨通志言逆耳不巧者謂之忠巧言美聽不中者謂之巧一心恪信道可就而功可成八達開通仙可學而真可遇亥時第二出滯升達上上舉翼昇喬木飛騰得意時乘風方借力一躍到天池出於幽谷遷於喬大昇騰得志之秋失之東隅得之桑榆靈貺亨嘉之際躍天池於萬里因風肋於一時亥時第三引獲迷誤上上流水碧溪長桃源路渺茫若非人指引豈得遇真光心着想者謂之迷意差謬者謂之誤流水碧溪訪桃源而有路迷途漸通倒亂顛危求妙理以知歸誤心復醒亥時第四力心任大下下螢火競月華小大意何差費却精神力終爲一笑誇一葉小舟不載萬鈞之重一泓淺水焉興百尺之波智識愚昩已非廊廟之賢才道行踈慵未有神仙之骨格亥時第五無助無望下下不學不知道不修不遇真工夫無一㸃徒自作空名功行兩全乃有達道昇仙之分學業俱美豈無科甲及第之榮既德行學業之不修望冨貴功名而差遠亥時第六現出明暗上上古鏡久昏昏光輝尚未聞一朝人拂拭妍醜自能分昏埃積於寳鑑得洗磨則光瑩復生淹滯出於善良遇提携則精神始懌鑑瑩净則可以照物命通達則可以成名亥時第七神真護佑上上香靄上丹霄誠心一念遥舉行無不利神物自昭昭寳鑪焚篆誠心達上於丹霄浄室延真舉意永無於欺諂舉一事自天佑之吉無不利謀一用唯神所護福有所歸亥時第八災退病除中平鬼散病已痊愁顔變笑顔誠心答天地更勿造諸愆凶方鬼散因道力以驅除幽室病消乃真光而護佑恭敬虔誠於香火衆善奉行消禳伸謝於愆尤諸惡莫作亥時第九除小不寧下下缺月未圓時家人獨掩扉未能伸屈曲陰小慮防危月缺虧光家人生重重之危厄花殘凋落陰小有疊疊之迍邅自身有暗昧屈曲之憂門户招唇吻是非之惱亥時第十口舌不寧下下泣泣更沉沉門闌非妄臨守静方能吉免使禍來侵沉吟少語胸中有鬱結之愁唇吻多端户内惹憂虞之事口舌争於争競隱忍爲先妄動起於不寧守静爲上亥時十一得時遇便上上舟行趁便風衆志一心同正遇良佳節花開滿目中得時用事逢良便易若推輪下水行舟遇順風速如奔騎對良辰興佳節柳綻花開會故友與新朋心同意合亥時十二樂極生悲下下樽空興已空心事正迷蒙本是逍遥客翻居滯礙中歡娱奢侈財空興竭成憂故縱貴婪罪極過深生禍本是逍遥之客强起悲顔幸爲快樂之人返求拘執亥時十三迷誤得省中平懷抱不堪言呻吟慮最先有人明語决醉醒覺輕便性迷則執見不通心解則通達易悟得人奇語如惠百鎰之良金快我心懷似飲一盃之酥酪亥時十四謀望無定下下意若雲中鴈心如水上萍狂蹤無定跡妙用豈能成雲鶴飛空之物準擬難憑萍梗泛水之蹤聚財不足所謀者必無望徒起所謀所用者必無成謾勞於用亥時十五望用必迍下下十言方成計慮事必先明不可輕輕舉終爲一笑聲陰謀執詐者謂之奸料度奇中者謂之策策不當而計不用返受餘殃事不審而謀不成徒爲人哂亥時十六先剉後成中平折翼下丹霄冲天忌已消更須宜養鋭再舉不爲勞鳥折翼則挫奮飛翱翔之鋭人失志則生退慚悔懶之心羽毛再整豈無霄漢之冲志業重修必有亨途之望亥時十七失則綰事下下倚恃必須失托人終見危虚將財與利空惹是和非協公倚勢如倚氷山太陽一照而氷解山摧輕信托人如搏雲霧暴風忽至而霧散雲飛財利俱亡交争並至亥時十八不可成事下下盲者不能行失音那有聲既盲並且啞事語兩無成所謀不遂如瞽者視毫末之微所望無成若瘖者起謳吟之韻既言視不能明曉則動用焉得遂通亥時十九遇貴成事上上森森古木高梁棟用非遥待時逢良匠知音契合招端森之木良匠擇而爲棟爲梁忠賢之士天官選而有權有禄材高名重則知音自遇學廣德深而契鑑須逢亥時二十遇時得濟上上月到中秋夜花逢二月春此時當慶賞百福盡維新中秋夜月一輪桂影團圓二月陽春萬卉芳葩錦繡慶佳辰而宴集百福臨門對良夜而清歡千祥萃户亥時二十一失時少遇下下中秋風雨後月暗不成輝獨坐空庭裏無言竟自悲風雨障中秋之月不覩蟾光迍蒙挫寒士之心惟逢蹇塞守空庭而獨處默默無言居宂舍而失時沉沉有恨亥時二十二改過得安中平逼迫上高山行人舉步難若能平正道不可用機關爲人豈得無過知其過則改過以自新謀事豈得不難經其難則先難而後易守正道者自安其分用機關者自撓其心亥時二十三憂事未寧下下虎逐群羊急風飄敗葉狂静中猶未得那得望成章倉惶失措如猛虎而逐群羊顛倒亂驚似急風而飄敗葉心欲静而未静餘事尚牽意欲寧而未寧外情内擾亥時二十四寡助少成下下渡口無舟楫陸行車挫輪不能相接濟隻力尚前奔非舟楫不能以濟渡非輪轂不可以行車寡助之情臨渡口而沉迷舟楫無成之意登平陸而挫折輪輗亥時二十五先憂後喜上上暴雨何來速雷霆忽起驚一時天意助月朗氣澄清暴雨急風桃李有摧殘之意轟雷掣電魚龍有震悚之驚風一静則月朗氣清雲一收則花紅柳緑亥時二十六功成道合上上養就真龍虎煉成白雪金功成神鬼助跨鶴上雲深真龍真虎盤旋於寳鼎之中白雪黄芽灌溉於丹田之内道存一氣乃長生久視之人功滿三千爲跨鶴騎鯨之侣亥時二十七謹身守道中平溺水千鈞石遭焚一束枯防心更防失謹謹學時餘多貪多欲如巨石溺於深淵縱性縱心若烈火焚於枯藁心不可不謹恐生禍患之機道不可不遵當守希夷之理亥時二十八神真扶護上上萬物莫非數窮通信有時道亨並道泰保爾禄延期天地循環各由其數萬物代謝悉有其時敬真守正之士公道泰而私道亨積功行善之人聖力扶而神力護亥時二十九遇恠自安中平見恠不爲怪逢驚不可驚但存心正直神物守門庭恠異見而不恠恠不爲凶驚惶見而不驚驚不爲禍寧其志定其心形神自安蕩其邪滌其穢家門自泰亥時三十狂縱天理中平六馬奔難馭三尸去勿追但能端守命造物不相違六馬者身之六賊謹禦謹防三尸者體内三鬼欲除欲滅六賊不縱身必安而命必延三尸驅除道可成而仙可就金行勿進待時下下漠漠一天雲沉沉雨意深路行山道險且更守郵亭意不遂如天雲漠漠情不舒若雨意沉沉山路險崎而難進守坐郵亭吾道窒塞而未通困居幽室木行去滯來亨中上缺月落西山鍾聲四遠間夢回人再醒整頓道心寬月落西山漸覺東方之欲曉鍾聲四遠時聞玉漏之催殘夢寐初醒昏昏昧濁始除道心一寬慊慊虞始退水行福禄高源上上紅日乾坤大丹砂妙道尊高名書玉簡厚禄付經綸陽烏赫赫升天百魔隱匿萬邪潜伏巍巍道德高聳九天保舉三界皈依王簡標而福禄召經書注而壽筭永火行節儉成福中平違和必少泰不節豈能寬戒止宜修儉存心自保完元氣損弱則疾病忽爾而生財物散消則困窮必然而至節儉者寬餘多福具守平和奢侈者禍敗有殃切宜戒止土行脱白得緑上上官封三品位名姓播天池遠近人欽仰天公也自知龍門一躍全無㸃額之憂名播四方乃有震雷之勢脱白麻而披緑綬金榜名高入紫微而掌僞鈞玉堂位顯玄真靈應寳籤卷下
