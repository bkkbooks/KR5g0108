body:
  text: 玄真靈應寳籤序始吾廟食劒嶺所降清河内傳落筆雙松凡所禱者竟以夢應然未嘗以籤行於世今正殿及家慶樓廟吏率借佗籤爲苟且計如十二真君籤即青城丈人觀籤如易卦在家慶尤無所證況夫川蜀行祠祇作朱真人内外籤耳今吾親考較妙用上自天文下至地理與夫運數之向背物情之離合者委嗣子等七人巧譬善諭以上中下各作成一百二十籤以十二時每時各三十籤又以五行金木水火土輳成三百六十五籤以按周天三百六十五度之數庶幾士之向信者隨其願力而各有所得焉九天開化主宰靈應帝君序九天開化主宰文昌帝君寳誥至心皈命禮不驕帝境玉真慶宫現九十八化之行藏顯億千萬種之神異飛鸞開化於在在如意救劫以生生至孝至仁功存者道儒釋教不驕不樂職盡乎天地水官功德難量威靈莫測大悲大願大聖大慈九天輔元開化主宰司禄職貢舉真君七曲靈應保德宏仁大帝談經演教消劫行化更生永命天尊
