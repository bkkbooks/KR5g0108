front:
  text: 玄真靈應寳籤卷中納三
  hash: sha256:eb1740852c8874cba191f9c16f556baa43648cdbf59e04e879c1508530916c4f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0108_HFL_002-001a, image: hfl/1011/1011-005.png}
body:
  text: 辰時第一天賜福祐上上天外散浮雲真仙降玉音福華並禄筭忻喜此門庭浮雲散則天氣朗而地氣清真仙集則家道昌而公道泰施恩布德自然禄筭之錦長奉道敬真必爾福華之延永辰時第二幽失不前下下天外起浮雲月華那更明行人山路嶮不可復登程浮雲障月掩桂魄以無光險路登程阻行人而失路心所急急而不濟所以進不可前事有阻阻而未通所以退不可後辰時第三人情見阻下下玉石共沉埋賢愚不並裁是非俱一體豈得共和諧至寳至美者謂之玉至頑至硬者謂之石有才有德者謂之賢無才無德者謂之愚既是非真僞之不分必人事乖訛而見阻辰時第四德意成慶上上獨步上雲霄前程萬里迢更無他阻障鸞鶴自逍遥耿耿雲霄則與塵泥之隔遠迢迢萬里始知前路之遥長無阻障者知其意而自然得逍遥者得其樂而成慶辰時第五如願遂心上上萬寳已成秋歡聲到風樓好將香火願共答百神庥百穀豐登萬寳收成之際千祥慶集一天和氣之時香火慇懃者則福力愈重愈高誠意堅確者則歡情愈安愈遂辰時第六平和遂利上上春色滿仙園風和花正妍賞心無一事舉措合神天和風麗日則草木秀而芳華樂事賞心則念慮消而悦懌物遇春雖朽壞亦可扶而敷榮人有道求名利亦自然而超遂辰時第七先憂後喜中平風浪急孤舟心中未遂遊彼岸人接力方始得安周風狂浪急出於不測之中旅泊舟孤正在驚惶之際神物護無虞無害心漸平寧人力接乃助乃安事方獲泰辰時第八進退不安下下碎事惱心懷人情兩未諧欲將心下事進退又訛乖凡事無巨無細有所感者則惱心懷凡人求進求通無所就者必損於志惱損心懷者謂之不安徒勞進退者謂之不遂辰時第九退保守吉中平月落五更殘家人獨掩關徘徊那有遂仍舊守吾庵西傾月落始知更漏之殘獨坐掩關自覺無聊之貺降寸心而屏息思慮外事休干守大道而頤養神形内衷不擾辰時第十殊祥祐吉上上洞庭秋色滿明月照波瀾好趁扁舟去蓬覔大舟洞庭秋夜之月色浩渺波瀾蓬萊麗日之春光熙和宇宙扁舟順濟風不動而浪不生大丹煉成神可昇而仙可遇辰時十一事因不快中平落葉滿庭除西風掃夜居幽人情不快餘困豈能甦心疲志困對西風着物之悲事拙謀乖起落葉辭柯之嘆欲棄之棄而不能食鷄玩助欲求之求而不得指鴈爲羹辰時十二求望未遂下下星月現微明光華事未分亭闌人去速心事惱精神新月初生未見團圓之桂影寸心未遂尚多顛錯之乖情故人去速則懷離别之悲憂事緒惱心則見艱難之阻遏辰時十三淹滯方甦上上枯木再逢春芳菲滿自明與君同慶賞遂得逐時新在根之木得春風則葉茂柯榮有道之人遇命亨則名超位達雖脱淹延之滯道德重修幸逢昌泰之時芳菲共賞辰時十四災退病除中平久困卧沉痾憂情甚被魔忽然良藥遇輕舉上雲羅綿綿困滯渾如久卧於沉痾疊疊憂懷何異困居於幽壑忽遇良劑病可退而疾可痊得濟高人出乎類而拔乎萃辰時十五往凶退吉下下孤客夜登程雲昏月色沉秪堪恨寥落回首竟無憑孤客登程夜已昏而月已落蹇人用事志已拙而謀已踈寥落者往則有不測之虞回首者退則少保安之福辰時十六前程進達上上文章得意歸恩沛賜緋衣光華修顯赫福禄自相依得意文場取功名如俯地拾芥進身台省被恩華如仰天太陽道德隆而嗣禄超榮福禄依而門庭顯赫辰時十七内外不寧下下默默坐空堂愁心未展張那堪人鬼路家宅事忙忙内不寧因家道不和外不寧因人事不順情懷鬱結人鬼怨嗟愁心默默幽怨多擾事悽悽歡樂少辰時十八平安凝福上上清晨一炷香天意保安康舉心皈大道福慶自然長晨香至禱祈門户之平安夙夜無欺保千齡而益美行一善則百神協助集福凝祥減一惡則萬禍蠲除宥愆赦過辰時十九心遠事遲中平萬斛沉舟發波津尚滿凝空存千里志未得一篙輕船閣淺灘不可棹而不可驚事逢憂滯不可奉而不可通志懷千里移寸步而尚阻尚難心有百端設機關而何施何用辰時二十意誠兩乖下下童蒙未解機昏識豈堪爲且守存餘意終成白首歸童蒙之子智識昧於奇才愚暗之人器量淺於大用失機會者功摧名墮白首無成大癡迷者事拙謀乖惶顔何濟辰時二十一聞憂不憂中平人倚在西樓秋深笛韻幽秪堪空自看不必更懷愁人懷愁感聞笛韻而生悲事繫憂心聽鴈聲而起慮釋其憂感則悲變爲歡安其心神則慮變爲慶辰時二十二聞喜不喜中平一鴈空傳信虚聲不見聲笑言憂喜事但且枉傳聞所聞者妄傳喜信喜自何生所見者惟是空花空則無實徒起矜誇之美譽一事無成空成懊惱之悲慚寸心有恨辰時二十三福至災釋上上道德助良緣天書降寳軒許多災厄慮一掃更無愆人有三災八難自作孽者不可活命有四柱五行自知分者必無撓害除吉祥自至紅日消氷𠎝尤散福慶自生暴風飄葉辰時二十四待時有慶中平有玉隱崑山光芒射斗寒若逢良匠别傳器在人間人懷道德如隱玉於石中命遇亨通似仙脱於凡殻道德仁義人之寳可聖可賢金玉珍珠世之珍乃冨乃貴辰時二十五先合後散下下灰冷寳爐寒樽空興已闌許多歡笑語渾似夢魂間篆消煙滅覺佳貺以闌删筵散樽空知歡娱而寂寞鴛侣有離别之恨鸞鑑分收斷絃無再續之期仙音渺絶辰時二十六事多撓攪下下擾擾復擾擾極目清江渺孤舟未得回望信空生惱忽忽擾擾目前如理亂絲或或惶惶心下若焚炎火江浩渺而歸舟未至目極魂消意縈惱而所事不通情疑腸斷辰時二十七謹防語失中平談笑生荆棘非言失所言若非良友鑑幾被苦牽纒觸犯忌諱乃刀劍生於口角其口宜緘譏訟是非而荆棘起於舌端其舌宜捲出一語而當三思舉一事而宜詳審辰時二十八自謹勿托中平舉措自端爲行藏更謹機托人爲所事恐後變成非所爲舉措遠邪佞而親君子似蘭斯馨動止行藏守端正而去暴慢如松之盛敬其事勿托非人謹其身而戒妄作辰時二十九得時爲喜上上滿目發芳菲仙園景最奇趁逢佳慶節歡笑醉金巵萬卉千葩到陽春而始秀懷才抱藝得時濟而方通靈根帶春氣而發萌君子遇時機而顯達辰時三十快疑退慮中平進退正宜新明人見意深好將懷内事一决自分明知進退存亡者乃有先見之明識利害榮辱者必無後悔之患心之疑慮遇良友而曉然事之幽潜得貴人而明辯巳時第一解怨生恩中平念念在存思相逢正彼如向時讎與怨兹者變歡娱以恩解怨炎炎火内生蓮以怨結寃凛凛氷中積雪恩不可㢮恩深而怨自消讎不可深讎解而怨自釋巳時第二遂意有期中平千里關山隔寸心飛去難忽然舟楫便不可更愁煩風快舟便何辭千里之遥事泰情通自有百祥之助遂其意愁煩自釋佳貺有期稱其心幽滯自除進謀有望巳時第三待時後遂中平一鈎新月微雲淡照庭幃雖未十分快團圓終可期萬物代謝各皆有時一世榮枯豈得無命寳月有圓有缺至三五而皎潔團圓凡人得遇得時遇際會則亨通顯達巳時第四悟道得真上上金丹大隱書玉典降天樞祕語今朝賜凡胎脫下軀金丹大典玄真祕密之文氣魄精神形體修護之物悟其道者祕語不傳之妙羽化飛昇識其理者參詳契合之微脱胎换骨巳時第五憂先喜後中平荒田久旱時農業正傷悲天澤忽然濟良苗救歲飢志學者心圖名禄勞苦在先力耕者意望秋成豐登在後天時順甘膏降澤苗槁重甦人事和美譽稱揚名權復顯巳時第六困滯俱生下下雲昏月又沉孤客守空庭寸心千萬意誰解起愁音危難驚惶淹延沉滯雲掩月則光輝不現風激水則波浪不寧一事無諧愁音起寸心不遂嗟嘆生巳時第七忽然有喜上上高臺百尺危快意望雲霓天外雙雙鶴飛來賜寳機脱幽出滯如釋重病之軀快意稱心若覽春臺之日鶴飛鳴而冲霄羽翼人脱爽而逸老安居巳時第八舉事有成上上甘澤降荒田靈苗發茂鮮秋成終有待佳節保安全田疇萬頃甘澤降而禾稼榮口體一身造物順而名禄顯舉一事有成有遂上德欣然謀一用處公處正下情允許巳時第九心勞事拙下下雲外幾重雲天書不可聞縱然心意恪殊不聽佳音密雲不雨徒生仰望之心丹詔不臨謾起沉吟之嘆志勤恪返爲怠墮功不成意縈牽殊無聽聞事不遂巳時第十所願遂心上上坐久待嬋娟雲開寳月圓開樽共清賞萬慮一齊捐雲開天浄寳月現而宇宙澄清災退病除吉福臨而謀用稱遂開樽俎而賞心樂事滌念慮而事泰心安巳時十一有助無阻上上長江千里遠風静水紋平好稱扁舟去謀爲盡契情得道者自然多助左逢挈而右逢提得時者何患無功上遇合而下遇順風静者水平舟穩契意者事遂情歡巳時十二情乖事背下下氷炭不同鑪彼情非我情更宜自詳謹心事勿相論水火不可同處爲其性質兩殊賢愚不可並居爲其智識不侔殊異共處情必乖邪正並居謀必背巳時十三貴人接引上上天福載文書欣欣各遂如朱衣相接引權要兩相扶文書有氣天禄駕而雲奔謀用無疑朱衣引而風助當權握者欣欣接遇進爵添階臨要路者穩穩扶持陞名益禄巳時十四小害無傷中平一鬼暗中笑豈知相竊窺雖無十分害第恐有微非人有鬼人物有鬼物生妬害者謂之鬼人作祟怪者謂之鬼物除鬼物者有天心之正法易以軀除辟鬼人無治術之良方難爲禁止巳時十五順守無害中平財利欲成時人情兩是非順之自和悦終保少憂危父子兄弟之不睦多以因財同儕朋友之不和豈非争競利之者愈爲不足失義虧仁讓之者順而自安名光譽美巳時十六漸有涯際中平景色始光輝憂心自退之方能進寸步漸可近天墀昏暝已退景色漸漸清明憂慮已消佳貺徐徐安泰進寸步可通千里何患不週謀一事可保百祥何憂不遂巳時十七敬真助福上上丹爐寳篆焚親事祝吾尊助爾清緣福心專道自存奉真者得其真力遇難自消奉佛者得其佛慈逢災自釋焚寳爐之丹篆默禱虔誠賜遐福之恩光昭明静應巳時十八陰小不寧下下鬼昧苦相持家庭陰小危舉心行善事解釋自安機家庭危厄蓋因歲蹇年災鬼魅侵欺多是志乖意僻正其心而行其事陰小自寧安其志而戒其非災害自息巳時十九未遂如心下下旱地豈行舟歸心未得由空令煙障客兀兀意悠悠倚舟旱地豈能濟而能行用事搏空豈得成而得遂歸心未展空悠悠而惆悵多誠意未周謾兀兀而歡悦少巳時二十起滯發幽上上寳劒射穹蒼邪幽鬼魅藏更無他滯礙威德發名揚寳劒乃正真君子射斗衝牛鬼魅乃陰邪小人伏幽藏隱威令發宣揚道德以正除邪功力就起拔幽潜以恩成福巳時二十一災退福生上上天樂發清音仙車降宅庭門闌光赫赫闔慶受嘉恩靈音清亮用事和而嘉信臨仙車降庭動則吉而美事集浮災微惱天邊已逐雲飛禄慶恩華户内福隨春至巳時二十二舊事再成上上舊事復重新退心變進心分明幽滯客翻作步雲人退心復進始知時有變更事再重新方表命逢協助不失青氈之故物幽閑重問得瞻金鑑之輝光容顔復整巳時二十三有助成喜上上歸心得便舟擾意復優游不必更惆悵故人相遇周歸心切切幸逢順便之舟擾意惶惶忽變優游之樂幽滯脱而亨途快爽春滿江山貴人進而成遂周圓光生閭里巳時二十四宜守勿動中平且守不可動動之事必訛月寒庭下静風鼓水中波人若謀動吉凶悔吝生焉心若妄求福禍災祥立至惟静守月照庭而清幽惟動求風鼓波而洶湧巳時二十五是非擾括下下月落又空山清幽事已闌寸心千里遠俱在是非間人之迍蹇作事是而反成非時之乖違道本亨而復爲否謀踈計拙寸心千里之間信遠音沉月落空山之外巳時二十六有氣可成中平寒灰事復然休言事向遷若逢人力助咫尺是前緣星落寒灰忽有復然之喜凋零枯木再生返緑之榮候其時而進咫尺可期得其助而成因而可就巳時二十七慶會亨通上上得意發新文縱横道濟民風雲相慶會惟爾保安寧事獲稱遂曰得意心無掛礙曰縱横雲龍風虎盤旋於金鼎之中達聖通真慶會於蓬壺之上巳時二十八和合通達上上豺狼陷石崖行客免憂懷去路平如掌相隨意自諧豺狼當道幸然天已驅除謀用始通頓爾心無憂惱去路平前程坦率進達四方事遂成衆志諧和利名相美巳時二十九𥆟災用事上上陰小脱重危家庭漸有輝許多憂惱事風掃變塵微陰小重重之危厄日照薄氷自身坎坎之災愆風飄枯葉敗毁樓臺復鼎新而修茸歌傾樹木再培植以扶持巳時三十福慶兩生上上鸞鳳舞翱翔香風降吉祥大開佳慶宴共集福華陽安静無禍曰福道德興隆曰慶鸞鳳翱翔爲天下瑞善念滋長則禄壽昌積善者餘慶乃生積德者遐福必至午時第一遲疑未達下下有意玩仙郷三山路渺茫不能升一步惟恨對斜陽蓬萊三島之郷有所聞而無所見求謀遠望之事已所用而未所成志甚速而行甚遲得甚難而失甚易午時第二喜用有助上上行遍幾重山今方得遂安更逢人指引得鹿始回還涉水登山歷遍崎嶇之險退災進福方成稱遂之安得人指引有功其功允濟得鹿回還有喜其喜普歡午時第三喜中有憂下下靉靆起雲霓晴天忽變悲一天星斗暗不見月光輝平寧安静恐生蹶步之憂喜笑歡欣慮有歛眉之歎雲霓忽起一天幽暗而生星月潜光滿目晦冥而至午時第四賜福得慶上上枯槁本無氣陽和一變春東君施化力均濟普沾恩枯槁之木非東君不能發萌職禄之來非貴人不能陶鑄田疇豐熟因沾雨露之恩草木敷榮均賴陽和之力午時第五超凡入聖上上青雲去路遥仙籍姓名標自有長生訣丹砂出聖苗道高德就名標仙籍之中行滿功成位列天曹之内得長生之妙訣返老還童授丹鼎之玄微降龍伏虎午時第六憂喜未决中平混沌似冥昏憂歡尚未分秪須天地豁鷄犬始能聞混沌冥昏之際尚未能分憂喜進退之間尚未能决更待天清地朗疑慮之事盡消始聞犬吠鷄鳴是非之端方覺午時第七守静待吉中平大道欲清幽存心勿妄求任他空撓聒一意止存脩守道之人心欲安而神欲静浮華之士意多妄而念多浮天與壽惟存脩而待之否與通但操正而執耳午時第八散憂退事中平退事勿再舉進心且息然妄傳多少意是非不能前憂事如水上輕漚不能持久喜事若空中搏影豈可得成所謀所用徒勞役志役心散喜散憂方可免災免咎午時第九虚空不實下下一溪春水流花落滿芳洲空作春花夢悠悠事未周榆錢不可以濟乏畫餅不可以充飢傳不可以信虚名不可以聽實落花過目隨即掃空春夢驚回無可玩味午時第十待時有望中下寳鼎尚沉埋才高未克諧一朝龍虎會有職盡添階事之未濟如金玉沉於泥沙時之未逢縱才智豈能亨達龍虎盤旋交會變異風雲時運際合亨通驟遷禄職午時十一疾退病除上上抱疾未能痊良醫在目前不須多悵恨非久得安全膏肓之病遇良醫則起死回生迷惑之心逢成病則頓開解悟災厄若退其病忽爾而痊命運若通其福自然而至午時十二終有成望上上有鹿在山前新花滿目妍歷終微險阻大可展愁顔遂鹿者歷遍崎嶇之險𤤌花者曾經霜雪之寒雖先見於至艱至難終成稱遂乃始逢於從心從欲大展歡顔午時十三扶持有獲中平護助非人力扶持乃至真分明舟欲覆廼得渡平津大厦將欹非大力而不能正沉舟欲覆非神助而不可扶平津得渡分明險處逢安彼岸得臨幸爾危中有救午時十四文書利泰上上千里一丹書傳來自寳樞望中爲得意職禄兩相扶丹韶來從千里恩寵光華寳樞賜於一朝官班品貴叩文書文書有氣化筆陶鎔占職禄職禄有榮貴人助順午時十五先阻後泰上上歷盡幾重山雲開天地寬不須多着力平步到玄關涉水登山歷盡艱辛之阻障雲開天浄幸逢爽快之良時玄開到而不遠勞役休辭謀用進而有期不須着力午時十六合成非久下下衰朽又何爲空言白首歸夕陽雖有景第恐不多時衰朽之木非梁棟之奇才輕諾之言非信實之良語彩雲虹影終不耐於久觀風梗浪萍必暫聚而復散午時十七守静勿用中平秋色到人間庭空月正閑丹爐香寂寂百事不相干性静情逸惠光朗朗圓明心動神疲業大炎炎熾赫心火定丹爐寂寂萬禍不侵障雲散夜月閑閑一毫不擾午時十八括擾未寧下下是是與非非稠人擾自爲欲求清浄理尤自格關機咎吝生於自擾擾則不寧是非起自喧争争則有怨關機藏隱逢怨惡而自滅自消清浄無爲遇寃尤而自解自釋午時十九憂事無害中平病虎卧前溪前人望自爲不能生陷害何用設狐疑惡心如猛虎當道不可不避舉步如履氷而行不可不謹曰敬曰恭災害自然不生守正守真咎吝何由而作午時二十得道成合上上洞庭春色闌仙友會雲班好覔長生藥逍遥餌大還仙巖碧洞滿天月白風清紫府蓬壺匝地普天春色道果成長生久視飽食蟠桃功力就快樂逍遥飛昇仙境午時二十一門户不寧下下幽鬼晴來退家門氣象陰謹身三七内漸可退餛迍虧心暗毒謂之幽幽隱不明害人竊物謂之鬼鬼邪侵擾門庭撓括宜鎮静而消禳群小争喧當謹身而退避午時二十二得恩感惠上上得道始提携超凡入聖機感心常激切恩惠足扶持得人提拔者謂之恩其恩最大與人財禄者謂之惠其惠尤深中心藏之常懷感激之心何日忘之自有神真之助午時二十三憂中有喜上上雷轟掣雷時邪魅已潜機幸得風雲散天高月正輝轟雷掣電豈誅有德之人白璧黄金不賜無功之子邪魅消幽魔蕩息道氣冲和風雲散星月光輝乾坤澄静午時二十四讒妬相害下下佞語巧非常侵之必有傷暗中藏利刃切欲要隄防佞人悦己面必譽而背必非讒口陰謀快似刀而利似劍比之蜂蠆之毒其毒尤深比之虎狼之惡其惡尤甚午時二十五道合遂成上上寳騎疾如飛青雲得路時機謀相遇合成遂豈能遲前程通達乘寳騎以如飛高步逍遥上青雲而得路謀成遇合言必聽而計必從福至心靈物必亨而名必遂午時二十六防謹言謗下下烈火燒珠玉讒言毁善良若人非解忿幾致有危傷珠玉之美必有纖瑕之析善良之士豈無讒毁之非消讒滅毁當宜潔己修身解忿釋愆尤在退思改過午時二十七用心不遂下下獨立斜陽裏殘蟬吸晚風一庭秋寂寞更漏已成空殘蟬斜日知景物以凄凉落葉西風覺秋容而寂寞更漏永夢中作夢夢寐不安心緒亂憂内懷憂憂疑未决午時二十八琢磨成器上上一躍龍門裏桃花浪幾重如今身得意勞逸已成功文場得意始酬立志之勤勞蟾宫攀桂已遂鷄牎之學業發奮志龍門一躍冠群倫名播四方午時二十九得遇扶持上上念念一何求憂心未得周忽然人借力携接上雲遊惟日孜孜一成名而成德亨途坦坦萬斯箱而千斯倉遇上人之協助風力吹毛逢大貴而提携雲開見日午時三十名利不遂下下財散風波裏名標雲霧間利名皆不遂回首掩柴關財寳散失沉埋萬頃風波名位虚無障隔一天雲霧回首者利不獲而名不就掩關者閉不開而塞不通未時第一家門利泰上上五福壽爲先年高禄更延一門佳氣集長幼慶安然康寧冨壽五福備而天下尊嘉慶安和一門集而長幼順孝於親者天道助而家道昌敬於真者吉事修而惡事退未時第二名禄成遂上上鹿駕文書急花開燕作喧春花成遂合每事喜相連鹿駕文書文書動而名禄遂春花燕語燕語喧而喜慶臨占遠信則遠信來叩近謀而近謀遂未時第三神功陰助中平竊盗來空室勞心任往還倘非神力助心致損機關偷盗之輩徒生竊害之心謀陷之中自有神真之護謹其身以却其禍災害不生守其分以安其福禍亂不作未時第四成濟爲事上上高田百種苗豐稔慶秋高喜得逢甘澤農家祝聖堯時豐歲念自無水旱之憂雨順風調必有秋成之望所謀所用之喜如甘雨以濟枯苗所望所求之心如凉風而解炎熱未時第五守真堅恪中平松栢傲霜雪浮花不耐春時真存節操堅恪保安寧守真守道之志如松栢而傲雪霜不凋不枯苟求苟望之人如浮花而敵風雨豈久堅確常以存心安寧自然獲福未時第六正心無疑中平天外一聲雷風雲慶會時邪人皆悚慓正士一皈依雷音轟烈警其惡而誅其邪鏡瑩浄明照其妍而鑑其配心若端正則無疑道若皈依則無懼未時第七出滯得快上上得道人多助時欣歲又歡豈能相阻遏去路自翱翔得道者所以多助天下順之守道者所以寡過一身安矣出其幽谷飛騰而脱滯趨亨步其去衢超越而遂心快意未時第八福臨災退上上鸞鳴鶴舞時仙仗下天墀待賜真光福災愆一宥之玉珮丁當駕龍車於碧漢綵雲繚繞擁仙仗於瑶空真光赫赫掃除天下之妖氛聖德巍巍普賜闔門之福慶未時第九忽然喜合上上十一口相扶相承百事如朱衣當引道聞喜降天書忽爾相承事有不期而會合因時際遇和同衆力之扶持况貴人生提挈之歡心主文書有陞遷之美意未時第十憂退慮消中平三女已消亡憂情自渺茫目前開豁意身後必嘉祥三女亡姦詐自然而屏息戎具退盗賊頓爾而消除雲收霧歛心眼有開豁之明慮散憂除謀用無淹延之滯未時十一利見大人上上利澤施于民歡聲化彩雲堯豐歲時泰萬境賀升平聖人德化惠可及於兆民君子道亨利可澤於天下堯年豐瑞一天星斗呈輝舜日熙和萬境歡聲誕布未時十二干人有阻下下計策已爲詐人情不可干再三空進退喜氣變愁顔人之情詐口雖諾而心必違道之乖訛言不從而謀不用心慇懃而至懇至切喜慶爲憂事漸懶而無阻無成進而後退未時十三退暗出明中平坐久清風發夢回明月生昏昏多少意方始見分明清風徐發滌炎熱以清凉明月初生照幽沉之昏暗進一步行途漸穩已有輕便謀一事逕路開通殊無障礙未時十四禳災謝過中平陰小恐生迍閑争事返驚禬禳憑道力香火更留心陰小坎坷門庭生不測之迍閑事喧争名位起不虞之惱急須謝過依憑大道之恩光速可消禳保祐家門之吉慶未時十五憂喜不成中平一木見雲霓空花發秀枝須臾無一事憂喜兩忘之雷雨收頓生霞彩江海浄忽起波濤須臾雲收霞散更無一㸃之悲歡頃刻花謝水流謾有兩忘之嗟嘆未時十六心速事遲下下策馬度嚴關天昏月又殘主人難進步惆悵起悲顔千里之程非一日而可至可達迂折之事非片言而可就可成漏殘月落徒生惆悵之悲心速事遲謾起呻吟之嘆未時十七虚聲妄意下下有寳隔千山無言向彼間聞聲名不實到了事空閑妄求之意有如空裏搏風虚想之心全似水中捉月徒取他人竊笑謾勞自己施爲事事無成謀謀何濟未時十八憂迍不寧下下家中蕭索事動静一成迍旺氣全然滅人憂鬼亦驚興敗頓成於蕭索灰冷煙沉動静恐染於迍邅心憂意慮守常守分猶防擾擾之非進望進求恐有怱怱之失未時十九成决未許下下見之則未見成之尚未成徘徊空進退來往枉勞心似見不見之形雖離婁而不可覩似聞不聞之語有師曠而不可聽既聞見尚未得真於成敗豈能便决未時二十名稱俱備上上紅日照乾坤嘉祥集孔門望中旌表至聲譽世間聞紅日升天陽氣舒而陰氣匿嘉祥集户人道亨而鬼道潛德業備而百世流馨忠節至而一門旌表未時二十一敗事復成上上紅日化嚴霜幽潛悉顯光枯根有生意漸可發芬芳嚴霜殺物物將敗而暖日消融巨浪飄舟舟欲覆而暴風忽息退散之事舉用必成枯朽之根栽培必活未時二十二驚心未寧下下靄靄一天雲風雷發震驚憂懷無限恨猶未脱埃塵靄靄雲生必有迅雷之發惶惶心動隄防虚詐之驚雖不至大難凶危之厄猶未脱小迍無妄之災未時二十三事遲有望中平大器晩當成大音希有聲琢磨方見寳不枉久勞心方鼎之器非一日之可成百里之雷非無時之有震丹砂宿火須憑九轉之功謀事稱心切要三思之用未時二十四利見大人上上蓬萊路渺茫仙洞歲時長得遇高人面靈機助玉章蓬萊路渺得其道出則何難仙洞遐長遇其真往則何遠夙緣契合利干上貴之人功名照然必感寳章之賜未時二十五萌事未發中平殘月待時久機關用處忙未知成敗事流水去何長栽培之木未遇春未可發萌謀望之心未得時未能成遂機關用而未遂空自愴忙智謀廣而無施謾勞心力未時二十六福實事厚上上歷古至于今金剛玉石身任他霜雪凛不改歲寒心烹金琢玉乃成至寳之珍植檜栽松何異雪霜之凛禄厚者雖火水不能有傷道成者縱邪魔安敢相逼未時二十七守節安吉上上貫道守于一持心不在狂坐中當見事笑默意何長有道之士守其一而不亂存心之人持其志而不回静默虚恬則養浩然之氣謙恭端謹則無暴慢之非未時二十八解怨成懽上上千里遇知心一天風月清怨情今已解爛熳醉懽忻結怨者自種今生之禍患施恩者必招宿世之因緣怨情既解一天風月澄清好貺重臨千里恩爛熳未時二十九待事如旦中平夜月照庭除清𤠔一嘯孤待須平旦日方可去登途𤠔啼悄悄徒勞枕上之思月影沉沉空役夢中之想候得時而進用事必曉然待平旦以登途路無阻礙未時三十危中有救上上狂浪欲覆舟憂慮不勝愁須臾臨彼岸新慶滿高樓波狂浪急舟欲覆而事欲危風定浪收船始安而心始泰臨彼岸已離危險天地扶持上高樓而慶新華人物豐美玄真靈應寳籤卷中
